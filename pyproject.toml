[project]
name = "goprofiles-mcp"
version = "0.1.0"
description = "GoProfiles MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.1.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    # zoneinfo needs a tz database to resolve naive scheduled times; the slim
    # base image is not guaranteed to ship /usr/share/zoneinfo.
    "tzdata>=2024.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
